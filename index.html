<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ismail Health Care</title>
<meta name="theme-color" content="#0f7b8a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root {
    --bg: #f4f7fa; --card: #fff; --text: #1d2733; --muted: #6b7a8c;
    --primary: #0f7b8a; --primary-d: #0b5f6b; --border: #dbe3ea;
    --ok: #2e8b57; --warn: #d98e04; --bad: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--primary); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button { background: rgba(255,255,255,.15); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: .9rem; }
  nav button.active { background: #fff; color: var(--primary-d); font-weight: 600; }
  #net { display: none; background: var(--warn); color: #fff; text-align: center; padding: 6px 10px; font-size: .85rem; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  h2 { margin: 0 0 12px; font-size: 1.1rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  .btn { background: var(--primary); color: #fff; border: 0; padding: 9px 16px; border-radius: 6px; cursor: pointer; font: inherit; margin-top: 12px; }
  .btn:hover { background: var(--primary-d); }
  .btn.small { padding: 5px 10px; margin: 0; font-size: .8rem; }
  .btn.ok { background: var(--ok); } .btn.bad { background: var(--bad); } .btn.grey { background: #7a8896; }
  .item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .item .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .badge { font-size: .75rem; padding: 2px 8px; border-radius: 99px; color: #fff; }
  .Pending { background: var(--warn); } .Confirmed { background: var(--ok); }
  .Cancelled { background: var(--bad); } .Completed { background: #5b6b7c; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .note { background: #f0f6f8; border-left: 3px solid var(--primary); padding: 6px 10px; margin-top: 6px; font-size: .9rem; border-radius: 4px; }
  .empty { color: var(--muted); font-style: italic; }
  .msg { color: var(--ok); font-size: .9rem; margin-top: 8px; min-height: 1.2em; }
  .code { font-family: monospace; font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; background: #eef7f8; padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>

<header>
  <h1>🏥 Ismail Health Care</h1>
  <nav id="nav"></nav>
</header>
<div id="net">You are offline. Your changes are saved on this phone and will be sent when the internet comes back.</div>

<main>
  <!-- PATIENT VIEW -->
  <section id="patient" class="view active">
    <div class="card">
      <h2>Book an appointment</h2>
      <form id="bookForm">
        <div class="row">
          <div><label>Full name</label><input id="bName" required maxlength="80"></div>
          <div><label>Phone</label><input id="bPhone" required maxlength="30"></div>
        </div>
        <div class="row">
          <div><label>Doctor</label><select id="bDoctor" required><option value="">Loading doctors…</option></select></div>
          <div><label>Date</label><input type="date" id="bDate" required></div>
        </div>
        <div class="row">
          <div><label>Time</label><input type="time" id="bTime" required></div>
          <div><label>Reason for visit</label><input id="bReason" required maxlength="250"></div>
        </div>
        <button class="btn" type="submit">Book appointment</button>
        <div class="msg" id="bMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2>My appointments</h2>
      <div class="row">
        <div><label>Have a booking code? Enter it here</label>
          <input id="codeInput" placeholder="Example: K7F29QXM3A" maxlength="10" style="text-transform:uppercase"></div>
        <div style="align-self:end"><button class="btn small" id="addCodeBtn" type="button" style="padding:10px 16px">Show my appointment</button></div>
      </div>
      <div id="myAppts" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>Ask for help</h2>
      <form id="helpForm">
        <div class="row">
          <div><label>Your name</label><input id="hName" required maxlength="80"></div>
          <div><label>Phone</label><input id="hPhone" required maxlength="30"></div>
        </div>
        <label>How can we help?</label>
        <textarea id="hText" required maxlength="900"></textarea>
        <button class="btn" type="submit">Send request</button>
        <div class="msg" id="hMsg"></div>
      </form>
    </div>
  </section>

  <!-- STAFF LOGIN -->
  <section id="login" class="view">
    <div class="card" style="max-width:420px;margin:0 auto">
      <h2>Staff login</h2>
      <form id="loginForm">
        <label>Email</label><input type="email" id="lEmail" required autocomplete="username">
        <label>Password</label><input type="password" id="lPass" required autocomplete="current-password">
        <button class="btn" type="submit">Log in</button>
        <button class="btn grey" type="button" id="forgotBtn" style="margin-left:6px">Forgot password?</button>
        <div class="msg" id="lMsg" style="color:var(--bad)"></div>
      </form>
    </div>
  </section>

  <!-- FIRST-TIME SETUP -->
  <section id="setup" class="view">
    <div class="card" style="max-width:420px;margin:0 auto">
      <h2>No staff access yet</h2>
      <p class="meta" id="setupInfo"></p>
      <form id="setupForm">
        <label>Owner setup code (first time only)</label>
        <input id="sCode" autocomplete="off" autocapitalize="characters">
        <button class="btn" type="submit">Become owner</button>
        <div class="msg" id="sMsg" style="color:var(--bad)"></div>
      </form>
    </div>
  </section>

  <!-- ADMIN: MANAGE STAFF -->
  <section id="admin" class="view">
    <div class="card">
      <h2>Add staff</h2>
      <form id="addStaffForm">
        <div class="row">
          <div><label>Role</label>
            <select id="aRole"><option value="doctor">Doctor</option><option value="receptionist">Receptionist</option></select></div>
          <div><label>Name (for doctors: name and speciality)</label>
            <input id="aName" required maxlength="100" placeholder="Dr. Ali Khan (MBBS, Dentist)"></div>
        </div>
        <div class="row">
          <div><label>Login email</label><input type="email" id="aEmail" required></div>
          <div><label>Password (only for a new login, 6 or more characters)</label><input type="text" id="aPass" autocomplete="off"></div>
        </div>
        <button class="btn" type="submit">Add</button>
        <div class="msg" id="aMsg"></div>
      </form>
    </div>
    <div class="card">
      <h2>Staff</h2>
      <div id="staffList"></div>
    </div>
  </section>

  <!-- RECEPTIONIST VIEW -->
  <section id="reception" class="view">
    <div class="card">
      <h2>Schedule</h2>
      <div class="row">
        <div><label>Filter by date</label><input type="date" id="fDate"></div>
        <div><label>Filter by status</label>
          <select id="fStatus">
            <option value="">All</option><option>Pending</option><option>Confirmed</option>
            <option>Completed</option><option>Cancelled</option>
          </select>
        </div>
      </div>
      <div id="schedule" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h2>Help requests</h2>
      <div id="helpList"></div>
    </div>
  </section>

  <!-- DOCTOR VIEW -->
  <section id="doctor" class="view">
    <div class="card">
      <h2 id="docTitle">My patients</h2>
      <div id="docPatients"></div>
    </div>
  </section>

  <!-- CHANGE MY PASSWORD -->
  <section id="account" class="view">
    <div class="card" style="max-width:420px;margin:0 auto">
      <h2>Change my password</h2>
      <form id="pwForm">
        <label>Current password</label><input type="password" id="pOld" required autocomplete="current-password">
        <label>New password (6 or more characters)</label><input type="password" id="pNew" required minlength="6" autocomplete="new-password">
        <button class="btn" type="submit">Change password</button>
        <div class="msg" id="pMsg"></div>
      </form>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, getDoc, updateDoc, addDoc, arrayUnion, onSnapshot, writeBatch, query, where
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword,
  sendPasswordResetEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// ---------- Firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyD0NgfX3ROCzlhKZGSxXa6jtMA6kDyHl6k",
  authDomain: "ismail-health-care.firebaseapp.com",
  projectId: "ismail-health-care",
  storageBucket: "ismail-health-care.firebasestorage.app",
  messagingSenderId: "913007195424",
  appId: "1:913007195424:web:9a716d2fd10e4c2978d345"
};
const fb = initializeApp(firebaseConfig);
let db;
try {   // keeps data on the phone so the app works offline
  db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) { db = getFirestore(fb); }
const auth = getAuth(fb);
const auth2 = getAuth(initializeApp(firebaseConfig, 'second'));   // used only to create new logins
const apptCol = collection(db, "appointments");
const helpCol = collection(db, "helpRequests");

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = a => `${a.date} at ${a.time}`;
const sortAppts = list => [...list].sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const slotRef = a => doc(db, "slots", `${slug(a.doctor)}_${a.date}_${a.time}`);
function newCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const r = crypto.getRandomValues(new Uint8Array(10));
  return Array.from(r, n => chars[n % chars.length]).join("");
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function say(el, text, good) { el.style.color = good ? 'var(--ok)' : 'var(--bad)'; el.textContent = text; }

$('bDate').min = new Date().toISOString().slice(0, 10);

// Offline banner
function net() { $('net').style.display = navigator.onLine ? 'none' : 'block'; }
addEventListener('online', net); addEventListener('offline', net); net();

// ---------- Doctor list (public, comes from the database) ----------
onSnapshot(collection(db, "doctors"), snap => {
  const names = snap.docs.map(d => d.data().name).filter(Boolean).sort();
  const cur = $('bDoctor').value;
  $('bDoctor').innerHTML = names.length
    ? names.map(n => `<option>${esc(n)}</option>`).join('')
    : '<option value="">No doctors added yet</option>';
  if (names.includes(cur)) $('bDoctor').value = cur;
}, () => {});

// ---------- Navigation ----------
let user = null, me = null, current = 'patient';
const HOME = { admin: 'admin', receptionist: 'reception', doctor: 'doctor' };

function allowed(v) {
  if (v === 'patient' || v === 'login') return true;
  if (!user) return false;
  if (v === 'setup') return !me;
  if (!me) return false;
  if (v === 'account') return true;
  if (v === 'admin') return me.role === 'admin';
  if (v === 'reception') return me.role === 'admin' || me.role === 'receptionist';
  if (v === 'doctor') return me.role === 'doctor';
  return false;
}
function show(v) {
  if (!allowed(v)) v = 'patient';
  current = v;
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === v));
  renderNav(); render();
}
function renderNav() {
  const items = [['patient', 'Patient']];
  if (!user) items.push(['login', 'Staff login']);
  else if (!me) items.push(['setup', 'Setup']);
  else {
    if (me.role === 'admin') items.push(['admin', 'Staff'], ['reception', 'Schedule']);
    if (me.role === 'receptionist') items.push(['reception', 'Receptionist']);
    if (me.role === 'doctor') items.push(['doctor', 'Doctor']);
    items.push(['account', 'Password']);
  }
  $('nav').innerHTML = items.map(([v, l]) =>
    `<button data-view="${v}" class="${v === current ? 'active' : ''}">${l}</button>`).join('')
    + (user ? `<button data-logout="1">Log out</button>` : '');
}
$('nav').addEventListener('click', e => {
  if (e.target.dataset.logout) { signOut(auth); return; }
  if (e.target.dataset.view) show(e.target.dataset.view);
});

// ---------- Login ----------
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('lMsg').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, $('lEmail').value.trim().toLowerCase(), $('lPass').value);
    e.target.reset();
  } catch { say($('lMsg'), 'Wrong email or password.', false); }
});
$('forgotBtn').addEventListener('click', async () => {
  const em = $('lEmail').value.trim().toLowerCase();
  if (!em) { say($('lMsg'), 'Type your email first, then tap Forgot password.', false); return; }
  try {
    await sendPasswordResetEmail(auth, em);
    say($('lMsg'), 'If this email has a login, a reset link was sent. Check your inbox and spam folder.', true);
  } catch { say($('lMsg'), 'Could not send. Check the email and your internet.', false); }
});

// ---------- Who is logged in ----------
let appts = [], helps = [], staffList = [], unsubs = [];
function stop() { unsubs.forEach(u => u()); unsubs = []; appts = []; helps = []; staffList = []; }

async function loadMe(email) {
  const key = 'staff_' + email;
  try {
    const s = await getDoc(doc(db, "staff", email));
    const data = s.exists() ? s.data() : null;
    store.set(key, data);
    return data;
  } catch (err) {
    if (err.code === 'permission-denied') return null;
    return store.get(key, null);   // offline: use what we saved last time
  }
}
function start() {
  const q = me.role === 'doctor' ? query(apptCol, where('doctor', '==', me.doctor)) : apptCol;
  unsubs.push(onSnapshot(q, snap => {
    appts = snap.docs.map(d => ({ notes: [], ...d.data(), id: d.id }));
    render();
  }, err => alert('Could not load appointments: ' + err.message)));
  if (me.role !== 'doctor') {
    unsubs.push(onSnapshot(helpCol, snap => {
      helps = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      render();
    }, err => console.error(err)));
  }
  if (me.role === 'admin') {
    unsubs.push(onSnapshot(collection(db, "staff"), snap => {
      staffList = snap.docs.map(d => ({ ...d.data(), email: d.id }));
      render();
    }, err => console.error(err)));
  }
}
async function enter() {
  stop();
  me = user ? await loadMe(user.email.toLowerCase()) : null;
  if (me) start();
  show(!user ? 'patient' : me ? HOME[me.role] : 'setup');
}
onAuthStateChanged(auth, u => { user = u; enter(); });

// First-time owner setup (needs the one-time setup code)
$('setupForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('sMsg').textContent = '';
  const key = $('sCode').value.trim().toUpperCase(), email = user.email.toLowerCase();
  try {
    const b = writeBatch(db);
    b.set(doc(db, "config", "setup"), { setupKey: key, by: email, at: Date.now() });
    b.set(doc(db, "staff", email), { role: 'admin', name: 'Owner', setupKey: key });
    await b.commit();
    $('sCode').value = '';
    await enter();
  } catch { say($('sMsg'), 'Wrong setup code, or setup was already done. Ask the owner to add your email under Staff.', false); }
});

// ---------- Change my password ----------
$('pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, m = $('pMsg');
  try {
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, $('pOld').value));
    await updatePassword(user, $('pNew').value);
    form.reset();
    say(m, 'Password changed.', true);
  } catch (err) {
    say(m, ['auth/wrong-password', 'auth/invalid-credential'].includes(err.code)
      ? 'Your current password is wrong.' : 'Could not change password: ' + err.message, false);
  }
});

// ---------- Admin: add and remove staff ----------
$('addStaffForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, m = $('aMsg');
  const role = $('aRole').value, name = $('aName').value.trim();
  const email = $('aEmail').value.trim().toLowerCase(), pw = $('aPass').value;
  if (pw && pw.length < 6) { say(m, 'The password needs 6 or more characters.', false); return; }
  say(m, 'Saving…', true);
  let note = '';
  try {
    if (pw) {
      try { await createUserWithEmailAndPassword(auth2, email, pw); }
      catch (err) {
        if (err.code !== 'auth/email-already-in-use') throw err;
        note = ' (This email already had a login, so its old password still works.)';
      } finally { try { await signOut(auth2); } catch {} }
    }
    const b = writeBatch(db);
    b.set(doc(db, "staff", email), role === 'doctor' ? { role, name, doctor: name } : { role, name });
    if (role === 'doctor') b.set(doc(db, "doctors", slug(name)), { name });
    await b.commit();
    form.reset();
    say(m, name + ' was added.' + note, true);
  } catch (err) { say(m, 'Could not add: ' + err.message, false); }
});

function renderAdmin() {
  if (!me || me.role !== 'admin') return;
  const order = { admin: 0, receptionist: 1, doctor: 2 };
  const mine = user.email.toLowerCase();
  const list = [...staffList].sort((a, b) => ((order[a.role] ?? 9) - (order[b.role] ?? 9)) || a.email.localeCompare(b.email));
  $('staffList').innerHTML = list.length ? list.map(s => `
    <div class="item">
      <div class="top"><strong>${esc(s.name || s.email)}</strong><span class="badge Completed">${esc(s.role)}</span></div>
      <div class="meta">${esc(s.email)}</div>
      <div class="actions">
        <button class="btn small grey" data-act="reset" data-email="${esc(s.email)}">Send password reset email</button>
        ${s.email === mine ? '' : `<button class="btn small bad" data-act="remove" data-email="${esc(s.email)}">Remove</button>`}
      </div>
    </div>`).join('') : '<div class="empty">No staff yet. Add your receptionist and doctors above.</div>';
}
$('staffList').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const email = btn.dataset.email, s = staffList.find(x => x.email === email); if (!s) return;
  if (btn.dataset.act === 'reset') {
    try {
      await sendPasswordResetEmail(auth, email);
      alert('Password reset email sent to ' + email + '.\nIt only arrives if this is a real email address.');
    } catch (err) { alert('Could not send: ' + err.message); }
  }
  if (btn.dataset.act === 'remove') {
    if (!confirm('Remove ' + (s.name || email) + '? They will no longer be able to use the staff pages.')) return;
    try {
      const b = writeBatch(db);
      b.delete(doc(db, "staff", email));
      if (s.role === 'doctor' && s.doctor) b.delete(doc(db, "doctors", slug(s.doctor)));
      await b.commit();
    } catch (err) { alert('Could not remove: ' + err.message); }
  }
});

// ---------- Shared actions ----------
async function cancelAppt(id) {
  const a = appts.find(x => x.id === id) || myData[id];
  if (!a) return;
  try {
    const b = writeBatch(db);
    b.update(doc(db, "appointments", id), { status: 'Cancelled' });
    b.delete(slotRef(a));   // free the time slot
    await b.commit();
  } catch (err) { alert('Could not cancel: ' + err.message); }
}
async function setStatus(id, status) {
  try { await updateDoc(doc(db, "appointments", id), { status }); }
  catch (err) { alert('Update failed: ' + err.message); }
}

// ---------- Patient ----------
$('bookForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, m = $('bMsg');
  if (!$('bDoctor').value) { say(m, 'Please choose a doctor.', false); return; }
  const id = newCode();
  const a = {
    name: $('bName').value.trim(), phone: $('bPhone').value.trim(),
    doctor: $('bDoctor').value, date: $('bDate').value, time: $('bTime').value,
    reason: $('bReason').value.trim(), status: 'Pending', notes: [], createdAt: Date.now()
  };
  say(m, 'Saving…', true);
  const b = writeBatch(db);
  b.set(doc(db, "appointments", id), a);
  b.set(slotRef(a), { apptId: id });   // fails if the slot is already taken
  const done = b.commit().then(() => null, err => err);
  const first = await Promise.race([done, new Promise(r => setTimeout(() => r('slow'), 6000))]);
  const failText = err => err.code === 'permission-denied'
    ? 'That time is already taken, or not allowed. Please choose another time.'
    : 'Could not save: ' + err.message;
  if (first && first !== 'slow') { say(m, failText(first), false); return; }
  addCode(id);
  if (first === 'slow') {
    // no internet: the booking is saved on this phone and sent later
    m.style.color = 'var(--warn)';
    m.innerHTML = `Saved on this phone. It will be sent when the internet is back. Your booking code is <span class="code">${id}</span>. Save it.`;
    done.then(err => {
      if (err) { removeCode(id); alert('Your booking ' + id + ' could not be saved. ' + failText(err)); }
      else { m.style.color = 'var(--ok)'; m.innerHTML = `Request sent! Your booking code is <span class="code">${id}</span>.`; }
    });
  } else {
    m.style.color = 'var(--ok)';
    m.innerHTML = `Request sent! Your booking code is <span class="code">${id}</span>. Save it (take a screenshot). You need it to see or cancel your appointment.`;
  }
  form.reset();
});

// Patients keep their booking codes on their own device
let myCodes = store.get('myCodes', []);
const myData = {};
const codeUnsubs = {};
function watchCode(code) {
  if (codeUnsubs[code]) return;
  codeUnsubs[code] = onSnapshot(doc(db, "appointments", code),
    s => { myData[code] = s.exists() ? { ...s.data(), id: s.id } : null; renderPatient(); },
    () => { myData[code] = null; renderPatient(); });
}
function addCode(code) {
  if (!myCodes.includes(code)) { myCodes.push(code); store.set('myCodes', myCodes); }
  watchCode(code);
}
function removeCode(code) {
  if (codeUnsubs[code]) { codeUnsubs[code](); delete codeUnsubs[code]; }
  delete myData[code];
  myCodes = myCodes.filter(c => c !== code); store.set('myCodes', myCodes);
  renderPatient();
}
myCodes.forEach(watchCode);

$('addCodeBtn').addEventListener('click', () => {
  const c = $('codeInput').value.trim().toUpperCase();
  if (c.length === 10) { addCode(c); $('codeInput').value = ''; }
  else alert('A booking code has 10 letters and numbers.');
});

function renderPatient() {
  const box = $('myAppts');
  if (!myCodes.length) { box.innerHTML = '<div class="empty">Book an appointment, or enter your booking code, to see it here.</div>'; return; }
  box.innerHTML = myCodes.map(code => {
    const a = myData[code];
    if (a === undefined) return `<div class="item"><div class="meta">Loading ${code}…</div></div>`;
    if (a === null) return `<div class="item"><div class="meta">No appointment found for code ${esc(code)}.</div>
      <div class="actions"><button class="btn small grey" onclick="removeCode('${code}')">Remove</button></div></div>`;
    return `<div class="item">
      <div class="top"><strong>${esc(a.doctor)}</strong><span class="badge ${a.status}">${a.status}</span></div>
      <div class="meta">${fmt(a)} · ${esc(a.reason)}</div>
      <div class="meta">Code: <span class="code" style="font-size:.9rem">${code}</span></div>
      ${(a.notes && a.notes.length) ? `<div style="margin-top:8px"><strong style="font-size:.85rem">Doctor's notes</strong>${a.notes.map(n => `<div class="note">${esc(n.text)}<div class="meta">${esc(n.time)}</div></div>`).join('')}</div>` : ''}
      <div class="actions">
        ${['Pending', 'Confirmed'].includes(a.status) ? `<button class="btn small bad" onclick="cancelAppt('${code}')">Cancel</button>` : ''}
        <button class="btn small grey" onclick="removeCode('${code}')">Hide</button>
      </div></div>`;
  }).join('');
}

$('helpForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  try {
    await Promise.race([
      addDoc(helpCol, {
        name: $('hName').value.trim(), phone: $('hPhone').value.trim(), text: $('hText').value.trim(),
        resolved: false, time: new Date().toLocaleString(), createdAt: Date.now()
      }),
      new Promise(r => setTimeout(r, 6000))
    ]);
    form.reset();
    say($('hMsg'), navigator.onLine ? 'Your request was sent. We will contact you soon.' : 'Saved on this phone. It will be sent when the internet is back.', true);
  } catch (err) { say($('hMsg'), 'Could not send: ' + err.message, false); }
});

// ---------- Receptionist ----------
$('fDate').addEventListener('input', renderReception);
$('fStatus').addEventListener('input', renderReception);

async function reschedule(id) {
  const a = appts.find(x => x.id === id); if (!a) return;
  const d = prompt('New date (YYYY-MM-DD):', a.date); if (!d) return;
  const t = prompt('New time (HH:MM):', a.time); if (!t) return;
  const updated = { ...a, date: d, time: t };
  try {
    if ((await getDoc(slotRef(updated))).exists()) { alert('That slot is already taken.'); return; }
    const b = writeBatch(db);
    b.update(doc(db, "appointments", id), { date: d, time: t });
    b.delete(slotRef(a));
    b.set(slotRef(updated), { apptId: id });
    await b.commit();
  } catch (err) { alert('Could not reschedule: ' + err.message); }
}

function renderReception() {
  if (!me || !['admin', 'receptionist'].includes(me.role)) return;
  const fd = $('fDate').value, fs = $('fStatus').value;
  const list = sortAppts(appts.filter(a => (!fd || a.date === fd) && (!fs || a.status === fs)));
  $('schedule').innerHTML = list.length ? list.map(a => `
    <div class="item">
      <div class="top"><strong>${esc(a.name)}</strong><span class="badge ${a.status}">${a.status}</span></div>
      <div class="meta">${fmt(a)} · ${esc(a.doctor)} · ${esc(a.phone)}</div>
      <div class="meta">Reason: ${esc(a.reason)}</div>
      <div class="actions">
        ${a.status === 'Pending' ? `<button class="btn small ok" onclick="setStatus('${a.id}','Confirmed')">Confirm</button>` : ''}
        ${['Pending', 'Confirmed'].includes(a.status) ? `
          <button class="btn small grey" onclick="reschedule('${a.id}')">Reschedule</button>
          <button class="btn small bad" onclick="cancelAppt('${a.id}')">Cancel</button>` : ''}
      </div>
    </div>`).join('') : '<div class="empty">No appointments match.</div>';

  $('helpList').innerHTML = helps.length ? helps.map(h => `
    <div class="item">
      <div class="top"><strong>${esc(h.name)}</strong>
        <span class="badge ${h.resolved ? 'Confirmed' : 'Pending'}">${h.resolved ? 'Resolved' : 'Open'}</span></div>
      <div class="meta">${esc(h.phone)} · ${esc(h.time)}</div>
      <div style="margin-top:6px">${esc(h.text)}</div>
      ${h.resolved ? '' : `<div class="actions"><button class="btn small ok" onclick="resolveHelp('${h.id}')">Mark resolved</button></div>`}
    </div>`).join('') : '<div class="empty">No help requests.</div>';
}
async function resolveHelp(id) {
  try { await updateDoc(doc(db, "helpRequests", id), { resolved: true }); }
  catch (err) { alert('Update failed: ' + err.message); }
}

// ---------- Doctor ----------
async function addNote(id) {
  const ta = document.getElementById('note-' + id);
  const text = ta.value.trim(); if (!text) return;
  try {
    await updateDoc(doc(db, "appointments", id), { notes: arrayUnion({ text, time: new Date().toLocaleString() }) });
  } catch (err) { alert('Could not save note: ' + err.message); }
}
const complete = id => setStatus(id, 'Completed');

function renderDoctor() {
  if (!me || me.role !== 'doctor') return;
  $('docTitle').textContent = `Patients of ${me.doctor}`;
  const list = sortAppts(appts.filter(a => a.status !== 'Cancelled'));
  $('docPatients').innerHTML = list.length ? list.map(a => `
    <div class="item">
      <div class="top"><strong>${esc(a.name)}</strong><span class="badge ${a.status}">${a.status}</span></div>
      <div class="meta">${fmt(a)} · ${esc(a.phone)}</div>
      <div class="meta">Reason: ${esc(a.reason)}</div>
      ${a.notes.map(n => `<div class="note">${esc(n.text)}<div class="meta">${esc(n.time)}</div></div>`).join('')}
      <textarea id="note-${a.id}" placeholder="Add a note…" style="margin-top:8px"></textarea>
      <div class="actions">
        <button class="btn small" onclick="addNote('${a.id}')">Save note</button>
        ${a.status !== 'Completed' ? `<button class="btn small ok" onclick="complete('${a.id}')">Mark completed</button>` : ''}
      </div>
    </div>`).join('') : '<div class="empty">No patients yet.</div>';
}

// ---------- Render ----------
function render() {
  if (user && !me) $('setupInfo').textContent = 'You are signed in as ' + user.email + '. This login has no staff access yet. If you are the owner, enter the setup code once. Otherwise ask the owner to add your email under Staff.';
  renderPatient(); renderReception(); renderAdmin();
  // don't wipe a note the doctor is typing when another update arrives
  if (!document.activeElement || !document.activeElement.id.startsWith('note-')) renderDoctor();
}

// Module scripts aren't global, so expose handlers used by inline onclick attributes
Object.assign(window, { cancelAppt, setStatus, reschedule, resolveHelp, addNote, complete, removeCode });
renderNav();
render();

// Offline support: keeps the app files on the phone
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
